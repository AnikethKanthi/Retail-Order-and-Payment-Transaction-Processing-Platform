spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/retail_platform}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-numbers-for-enums: true
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

payment:
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}

server:
  port: ${SERVER_PORT:8082}
