spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/retail_platform}
    username: ${INVENTORY_DB_USER}
    password: ${INVENTORY_DB_PASSWORD:}
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
